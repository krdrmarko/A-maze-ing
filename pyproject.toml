[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator from the 42 A-Maze-ing project"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "makrivor" },
    { name = "ysekioka" },
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the generator is shipped; the app (amazeing/) stays in the repo.
packages = ["mazegen"]

[tool.black]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
exclude = ["^\\.venv/", "^build/"]
